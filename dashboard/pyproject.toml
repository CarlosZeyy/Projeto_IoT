[project]
name = "qc-dashboard"
version = "0.0.0"
description = "Streamlit dashboard (reads everything through qc-api)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qc-contracts",
    "streamlit",
    "plotly",
    "pandas",
    "httpx",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_dashboard"]

[tool.uv.sources]
qc-contracts = { workspace = true }
