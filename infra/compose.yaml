# PartQC na VPS pessoal (SPEC-015 §4.12, ADR-018): Caddy (TLS e proxy) + qc-api + qc-dashboard.
#
# Uso, sempre a partir da raiz do checkout:
#   docker compose -f infra/compose.yaml config --quiet     (nunca sem --quiet: imprime segredos)
#   docker compose -f infra/compose.yaml up -d --build
#
# Arquivos de ambiente, todos em infra/, fora do Git e do contexto de build, com chmod 600:
#   infra/.env           PUBLIC_HOST e os limites de recursos (interpolação deste arquivo)
#   infra/.env.api       DATABASE_URL (pooler, porta 6543) e READ_API_KEY
#   infra/.env.dashboard READ_API_KEY
# Valores com $ vão entre aspas simples (sem aspas, o Compose interpola).
#
# Só o caddy publica portas. Nunca rode "docker compose down -v": apaga o volume caddy_data
# (certificados) e pode esbarrar no limite de emissão do Let's Encrypt.

name: partqc

services:
  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:?set PUBLIC_HOST in infra/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      partqc:
        # O https://<subdominio> que o dashboard chama resolve, dentro da rede, para este Caddy.
        aliases:
          - "${PUBLIC_HOST:?set PUBLIC_HOST in infra/.env}"
    depends_on:
      - api
      - dashboard
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${CADDY_MEM_LIMIT:-256m}"
    cpus: "${CADDY_CPUS:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env.api
    expose:
      - "8000"
    networks:
      - partqc
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${API_MEM_LIMIT:-512m}"
    cpus: "${API_CPUS:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard.Dockerfile
    env_file:
      - .env.dashboard
    environment:
      # Prevalece sobre o env_file; sempre https:// (SEC-13-01, SPEC-028).
      API_BASE_URL: "https://${PUBLIC_HOST:?set PUBLIC_HOST in infra/.env}"
    expose:
      - "8501"
    networks:
      - partqc
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${DASHBOARD_MEM_LIMIT:-1g}"
    cpus: "${DASHBOARD_CPUS:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  partqc:
    # Sem "internal": a API precisa sair para o Supabase.
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
