# PartQC: recurso "partqc-web" do Coolify, com o Caddy (roteador interno em HTTP) e o
# qc-dashboard (ADR-023 e emenda 1, SPEC-039; antes, SPEC-015 §4.12). A qc-api é o outro recurso,
# "partqc-api" (infra/compose.api.yaml).
#
# No Coolify (recurso "Docker Compose" a partir do repositório público, docs/deployment-plan.md §4):
#   Base Directory /infra e Docker Compose Location /compose.yaml (o context: .. dos dois serviços
#   aponta para a raiz do repositório);
#   domínio só no serviço caddy, na porta interna 80 (https://<subdominio>:80). O TLS e o
#   certificado ficam no proxy do Coolify, e nenhum serviço publica portas. O "partqc-api" não
#   tem domínio: o caddy chega à API pela rede externa partqc-api-link;
#   as variáveis ficam nas Environment Variables deste recurso: só PUBLIC_HOST, READ_API_KEY (o
#   mesmo valor do "partqc-api"; segredo: só em runtime, Locked e Literal), MODEL_METRICS_PATH e
#   os limites do caddy e do dashboard. O Coolify entrega o .env do recurso a todos os serviços
#   dele, então os segredos do banco e dos alertas nunca entram neste recurso (SEC-39-01). As
#   referências ${...:?} são obrigatórias e bloqueiam o deploy se faltarem;
#   primeiro deploy: o "partqc-api" antes deste, porque ele cria a rede partqc-api-link.
#
# Conferência local, a partir da raiz do checkout, com um infra/.env de valores fictícios (fora
# do Git e do contexto de build), o mesmo dos dois arquivos:
#   docker compose -f infra/compose.api.yaml config --quiet
#   docker compose -f infra/compose.yaml config --quiet     (nunca sem --quiet: imprime segredos)
#
# Endurecimento (SPEC-032 §4.4): sistema de arquivos só de leitura (read_only), com tmpfs em /tmp
# (64m) e, no Caddy, também em /data e /config (16m, sem estado: os certificados são do proxy do
# Coolify), e limite de processos e threads (pids_limit, padrão 256, ajustável nas variáveis do
# recurso). Um serviço que parar depois de uma atualização com "Read-only file system" no log
# precisa de um tmpfs novo, medido (deployment-plan).
#
# Sem labels do proxy (o Coolify gera as dele) e sem healthcheck no Caddy: um contêiner unhealthy
# sai da rota do proxy do Coolify, e o site inteiro cairia (ADR-023).

name: partqc

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/docker/caddy.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      # default: o dashboard; link: a API do "partqc-api" (api:8000).
      - default
      - link
    depends_on:
      - dashboard
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${CADDY_MEM_LIMIT:-256m}"
    cpus: "${CADDY_CPUS:-0.5}"
    pids_limit: "${CADDY_PIDS_LIMIT:-256}"
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
      - "/data:size=16m"
      - "/config:size=16m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard.Dockerfile
    environment:
      # Sempre https:// (SEC-13-01, SPEC-028): resolve pelo DNS e volta pelo proxy do Coolify.
      API_BASE_URL: "https://${PUBLIC_HOST:?}"
      READ_API_KEY: "${READ_API_KEY:?}"
      MODEL_METRICS_PATH: "${MODEL_METRICS_PATH:-}"
    expose:
      - "8501"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${DASHBOARD_MEM_LIMIT:-1g}"
    cpus: "${DASHBOARD_CPUS:-1.0}"
    pids_limit: "${DASHBOARD_PIDS_LIMIT:-256}"
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  link:
    # Criada pelo "partqc-api" (infra/compose.api.yaml), que sobe antes.
    name: partqc-api-link
    external: true
