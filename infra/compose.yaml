# PartQC na VPS pessoal, publicado pelo Coolify (ADR-023, SPEC-039; antes, SPEC-015 §4.12):
# Caddy (roteador interno em HTTP) + qc-api + qc-dashboard.
#
# No Coolify (recurso "Docker Compose" a partir do repositório público, docs/deployment-plan.md §4):
#   Base Directory /infra e Docker Compose Location /compose.yaml (o context: .. dos três serviços
#   aponta para a raiz do repositório);
#   domínio só no serviço caddy, na porta interna 80 (https://<subdominio>:80). O TLS e o
#   certificado ficam no proxy do Coolify, e nenhum serviço publica portas;
#   as variáveis ficam nas Environment Variables do recurso no painel. Os segredos (DATABASE_URL,
#   READ_API_KEY e, se usado, TELEGRAM_BOT_TOKEN) só em runtime, Locked e Literal. As referências
#   ${NOME:?} são obrigatórias e bloqueiam o deploy se faltarem. Nenhum arquivo de ambiente é
#   criado à mão na VPS.
#
# Conferência local, a partir da raiz do checkout, com um infra/.env de valores fictícios (fora
# do Git e do contexto de build):
#   docker compose -f infra/compose.yaml config --quiet     (nunca sem --quiet: imprime segredos)
#
# Endurecimento (SPEC-032 §4.4): sistema de arquivos só de leitura (read_only), com tmpfs em /tmp
# (64m) e, no Caddy, também em /data e /config (16m, sem estado: os certificados são do proxy do
# Coolify), e limite de processos e threads (pids_limit, padrão 256, ajustável nas variáveis do
# recurso). Um serviço que parar depois de uma atualização com "Read-only file system" no log
# precisa de um tmpfs novo, medido (deployment-plan).
#
# Sem labels do proxy (o Coolify gera as dele), sem rede própria e sem healthcheck no Caddy: um
# contêiner unhealthy sai da rota do proxy do Coolify, e o site inteiro cairia (ADR-023).

name: partqc

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/docker/caddy.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
      - dashboard
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${CADDY_MEM_LIMIT:-256m}"
    cpus: "${CADDY_CPUS:-0.5}"
    pids_limit: "${CADDY_PIDS_LIMIT:-256}"
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
      - "/data:size=16m"
      - "/config:size=16m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:?}"
      READ_API_KEY: "${READ_API_KEY:?}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-262144}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Alertas da SPEC-017, opcionais e desligados por padrão (antes do merge dela, ignorados).
      ALERTS_ENABLED: "${ALERTS_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      ALERTS_LOT_IDLE_MINUTES: "${ALERTS_LOT_IDLE_MINUTES:-10}"
      ALERTS_LOOKBACK_HOURS: "${ALERTS_LOOKBACK_HOURS:-24}"
      ALERTS_CHECK_INTERVAL_S: "${ALERTS_CHECK_INTERVAL_S:-60}"
      ALERTS_MAX_PER_HOUR: "${ALERTS_MAX_PER_HOUR:-10}"
      ALERTS_INCLUDE_SIMULATED: "${ALERTS_INCLUDE_SIMULATED:-false}"
    expose:
      - "8000"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${API_MEM_LIMIT:-512m}"
    cpus: "${API_CPUS:-1.0}"
    pids_limit: "${API_PIDS_LIMIT:-256}"
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard.Dockerfile
    environment:
      # Sempre https:// (SEC-13-01, SPEC-028): resolve pelo DNS e volta pelo proxy do Coolify.
      API_BASE_URL: "https://${PUBLIC_HOST:?}"
      READ_API_KEY: "${READ_API_KEY:?}"
      MODEL_METRICS_PATH: "${MODEL_METRICS_PATH:-}"
    expose:
      - "8501"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "${DASHBOARD_MEM_LIMIT:-1g}"
    cpus: "${DASHBOARD_CPUS:-1.0}"
    pids_limit: "${DASHBOARD_PIDS_LIMIT:-256}"
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
