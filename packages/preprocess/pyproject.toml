[project]
name = "qc-preprocess"
version = "0.0.0"
description = "Deterministic image preprocessing shared by training and edge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_preprocess"]
