[project]
name = "qc-contracts"
version = "0.4.0"
description = "Shared enums and Pydantic schemas (contract)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_contracts"]
