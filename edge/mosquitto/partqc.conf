# Mosquitto do PartQC (SPEC-020, opção C do ADR-009): broker MQTT só no notebook da borda.
# Uso: mosquitto -c edge/mosquitto/partqc.conf   (passo a passo em edge/README.md, "Transporte MQTT")
#
# Escuta só em loopback: nenhum outro aparelho da LAN, nem a internet, alcança o broker. A nuvem
# continua recebendo pela rota HTTP autenticada da API, por meio da ponte
# (python -m qc_edge.mqtt_bridge). Um broker fora do notebook exige um ADR novo.
listener 1883 127.0.0.1

# Sem cliente anônimo: a borda e a ponte entram com MQTT_USERNAME e MQTT_PASSWORD (.env, R-03).
allow_anonymous false

# Arquivo de senhas criado com mosquitto_passwd FORA do repositório (nunca no Git, R-03), ex.:
#   mkdir -p ~/.config/partqc && chmod 700 ~/.config/partqc
#   mosquitto_passwd -c ~/.config/partqc/mosquitto.passwd partqc-edge
# Troque <usuario> pelo seu usuário (o Mosquitto não expande ~).
password_file /home/<usuario>/.config/partqc/mosquitto.passwd
