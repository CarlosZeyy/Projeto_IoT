[project]
name = "qc-edge"
version = "0.0.0"
description = "Edge gateway on the LAN: capture, inference, decision, outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qc-contracts",
    "qc-preprocess",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "qrcode",
    "httpx",
    "python-multipart",
    "pydantic-settings>=2",
    # SPEC-025 section 4.2: decode limiter (anyio.Semaphore, created outside an event loop).
    "anyio>=4.15",
    # SPEC-020: MQTT 5 transport (EPL-2.0 OR BSD-3-Clause); imported only by qc_edge.mqtt_transport.
    "paho-mqtt>=2.1,<3",
]

[dependency-groups]
# SPEC-008: builds the dummy ONNX models of the tests (onnx.helper); never a runtime dependency.
dev = [
    "onnx",
]

[project.scripts]
qc-edge = "qc_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_edge"]

[tool.uv.sources]
qc-contracts = { workspace = true }
qc-preprocess = { workspace = true }
