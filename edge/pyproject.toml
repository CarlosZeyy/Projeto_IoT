[project]
name = "qc-edge"
version = "0.0.0"
description = "Edge gateway on the LAN: capture, inference, decision, outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qc-contracts",
    "qc-preprocess",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "qrcode",
    "httpx",
    "python-multipart",
    "pydantic-settings>=2",
]

[project.scripts]
qc-edge = "qc_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_edge"]

[tool.uv.sources]
qc-contracts = { workspace = true }
qc-preprocess = { workspace = true }
