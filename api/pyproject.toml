[project]
name = "qc-api"
version = "0.1.0"
description = "Cloud API (FastAPI): ingestion, readings, metrics, SPC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qc-contracts",
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_api"]

[tool.uv.sources]
qc-contracts = { workspace = true }
