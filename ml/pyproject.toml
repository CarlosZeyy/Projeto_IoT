[project]
name = "qc-ml"
version = "0.0.0"
description = "Dataset, split, training, evaluation and ONNX export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qc-contracts",
    "qc-preprocess",
    "numpy",
    "pandas",
    "scikit-learn",
    "onnxruntime",
    "pillow",
]

[project.optional-dependencies]
# Heavy training stack (ADR-004): only with `uv sync --all-packages --extra train`.
train = [
    "torch",
    "torchvision",
    "timm",
    "onnx",
    "coral-pytorch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_ml"]

[tool.uv.sources]
qc-contracts = { workspace = true }
qc-preprocess = { workspace = true }
