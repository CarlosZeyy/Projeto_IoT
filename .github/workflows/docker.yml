# Imagens do PartQC (SPEC-015 §4.14): constrói as imagens da API e do dashboard e roda os testes
# marcados `docker` (sem registro de imagens, sem login e sem deploy: o build de produção é feito
# na própria VPS, ADR-018). O ci.yml não muda: ali os testes `docker` aparecem como skip.
name: docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    name: docker images + pytest -m docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # O conftest.py da raiz exige TEST_DATABASE_URL quando CI=true; os testes `db` não são
      # selecionados aqui. Mesmo serviço e mesma URL do ci.yml.
      postgres:
        image: postgres:16
        env:
          # `trust` (conexão sem senha) vale só para este contêiner efêmero do CI, descartado ao
          # fim do job e acessível apenas pelo runner. Nunca use `trust` fora do CI (R-03).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: partqc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d partqc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/partqc_test
      UV_FROZEN: "1"
      PARTQC_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      # Mesma versão fixada do ci.yml.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -m docker -q
